<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Team | Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>
    
    <main class="shell">
      <header class="page-head">
        <div>
          <p class="eyebrow">A Team</p>
          <h1>Agent Workspace Dashboard</h1>
        </div>
        <nav class="top-nav">
          <a href="/monitor/" class="top-nav-link">Real-time KPI</a>
          <a href="/monitor/jobs.html" class="top-nav-link active">History & Timeline</a>
        </nav>
        <div class="head-controls">
          <button id="history-refresh-now" type="button">Refresh List</button>
        </div>
      </header>

      <div class="dashboard-layout">
        <!-- 영역 1: 왼편 - 작업 히스토리 리스트 -->
        <aside class="sidebar-panel">
          <div class="panel-head" style="padding: 1rem; border-bottom: 1px solid var(--line);">
            <h2>Job History</h2>
          </div>
          <div class="sidebar-scroll">
            <div id="job-list-container" class="table-wrap" style="margin-top: 0;">
              <table style="min-width: unset; width: 100%;">
                <tbody id="history-jobs-body">
                  <tr><td class="empty">Loading jobs...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </aside>

        <div class="main-content">
          <!-- 영역 2: 오른쪽 상단 - 단계별 에이전트 타임라인 매트릭스 -->
          <section class="timeline-matrix-panel">
            <div class="panel-head">
              <h2>Timeline Matrix</h2>
              <p id="selected-job-info" class="subline">Select a job to view timeline</p>
            </div>
            <div id="matrix-container" style="margin-top: 1rem;">
              <p class="empty">Timeline will be rendered here...</p>
            </div>
          </section>

          <!-- 영역 3: 오른쪽 하단 - 에이전트별 채팅 리스트 -->
          <section class="chat-view-panel">
            <div class="panel-head">
              <h2 id="chat-title">Agent Logs & Conversation</h2>
              <button id="refresh-selected" type="button" class="ghost" style="padding: 0.2rem 0.5rem; font-size: 0.7rem;">Sync Logs</button>
            </div>
            <div id="chat-container" class="chat-scroll">
              <p class="empty">Select an agent node from the matrix above to view detailed logs.</p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="./jobs.js"></script>
  </body>
</html>
